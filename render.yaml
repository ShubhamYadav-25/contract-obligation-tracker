services:
  - type: web
    runtime: node
    name: contract-obligation-tracker-api
    plan: free
    buildCommand: npm install --global pnpm@10.14.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @contract-obligation-tracker/api run build
    startCommand: node apps/api/dist/src/scripts/apply-workflow-migrations.js && node apps/api/dist/src/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://contract-obligation-tracker-web.onrender.com
      - key: CORS_ORIGIN
        value: https://contract-obligation-tracker-web.onrender.com
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: OBLIGATION_EXTRACTOR_MODE
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: OCR_PROVIDER
        value: tesseract
      - key: TESSERACT_WORKER_COUNT
        value: "1"
      - key: EMAIL_PROVIDER
        value: console
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json

  - type: web
    runtime: static
    name: contract-obligation-tracker-web
    plan: free
    buildCommand: npm install --global pnpm@10.14.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @contract-obligation-tracker/web run build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_API_BASE_URL
        value: https://contract-obligation-tracker-api.onrender.com
      - key: VITE_DEV_ORGANIZATION_ID
        value: 00000000-0000-4000-8000-000000000001
      - key: VITE_DEV_USER_ID
        value: 00000000-0000-4000-8000-000000000002
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
